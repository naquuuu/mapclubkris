<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAPCLUB Postal Code Improvement - Prototype</title>
<meta name="description" content="Clickable prototype for the MAPCLUB postal code improvement: cascading address selection and customer remediation flow.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
:root{
  --red:#C4122E; --cta:#A8172A; --txt:#1A1A1A; --mut:#6E6E6E; --faint:#9B9B9B;
  --brd:#E6E6E6; --line:#EFEFEF; --alert-bg:#FDF2F3; --alert-brd:#F1C7CE; --alert-tx:#A50E26;
  --ok:#1E874B; --ok-bg:#EFF7F1; --ok-brd:#CDE7D6; --shell:#22242A; --shell2:#2C2F37;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Nunito Sans','Segoe UI',system-ui,sans-serif;background:#15171B;color:var(--txt);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
a{color:var(--red);text-decoration:none}

/* ---------- prototype chrome ---------- */
.top{position:sticky;top:0;z-index:50;background:var(--shell);border-bottom:1px solid #34373F;padding:14px 22px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.brand{color:#fff;font-size:15px;font-weight:700;letter-spacing:.2px}
.brand span{color:#8C919C;font-weight:400;margin-left:9px;font-size:13px}
.tabs{display:flex;gap:6px;background:var(--shell2);padding:4px;border-radius:999px}
.tab{border:none;background:transparent;color:#A9AEB9;font-size:13.5px;font-weight:600;padding:8px 16px;border-radius:999px}
.tab[aria-selected="true"]{background:var(--red);color:#fff}
.spacer{flex-grow:1}
.ghost{border:1px solid #454952;background:transparent;color:#C3C8D2;font-size:13px;font-weight:600;padding:8px 15px;border-radius:999px}
.ghost:hover{border-color:#6B7180;color:#fff}
.stage{padding:34px 22px 70px;display:flex;justify-content:center}
.col{width:100%;max-width:1180px}
.hint{color:#8C919C;font-size:13.5px;line-height:1.6;max-width:640px;margin:0 auto 26px;text-align:center}
.hint b{color:#D7DBE3;font-weight:700}
.segrow{display:flex;justify-content:center;gap:8px;margin-bottom:26px;flex-wrap:wrap}
.seg{border:1px solid #3C4049;background:var(--shell2);color:#B7BCC6;font-size:13px;font-weight:600;padding:9px 17px;border-radius:999px}
.seg[aria-pressed="true"]{background:#fff;color:#15171B;border-color:#fff}
.caption{color:#7B808B;font-size:12px;text-align:center;margin-top:14px;letter-spacing:.3px}

/* ---------- surfaces ---------- */
.modal{width:100%;max-width:600px;margin:0 auto;background:#fff;border-radius:28px;box-shadow:0 24px 60px rgba(0,0,0,.45);overflow:hidden;position:relative}
.phone{width:390px;background:#fff;border-radius:34px;box-shadow:0 24px 60px rgba(0,0,0,.45);overflow:hidden;position:relative;display:flex;flex-direction:column;height:812px}
.phonewrap{display:flex;justify-content:center;gap:34px;flex-wrap:wrap}
.pbody{flex-grow:1;overflow-y:auto;overscroll-behavior:contain}
.pbody::-webkit-scrollbar{width:0}

/* ---------- shared form bits ---------- */
.mhdr{display:flex;align-items:center;gap:16px;padding:24px 30px 16px}
.mtitle{font-size:22px;font-weight:700;flex-grow:1;letter-spacing:-.2px}
.iconbtn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;padding:0;color:var(--txt)}
.mkicker{padding:0 30px 14px;font-size:11.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--red)}
.mbody{padding:6px 30px 4px;display:flex;flex-direction:column;gap:20px}
.lbl{font-size:14px;font-weight:600;color:#2B2B2B;margin-bottom:8px}
.lbl.off{color:#B4B4B4}
.ta{width:100%;border:1px solid #D9D9D9;border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.5;min-height:76px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 22px}
.sel{width:100%;height:52px;border:1px solid #D9D9D9;border-radius:10px;padding:0 14px 0 16px;background:#fff;display:flex;align-items:center;gap:8px;text-align:left}
.sel:hover{border-color:#B0B0B0}
.sel.off{border-color:#E8E8E8;background:#FAFAFA;cursor:not-allowed}
.sel.off:hover{border-color:#E8E8E8}
.selv{flex-grow:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#2B2B2B}
.selv.ph{color:#A8A8A8}
.ro{width:100%;height:52px;border:1px solid #E0E0E0;border-radius:10px;padding:0 14px 0 16px;background:#F4F4F4;display:flex;align-items:center;gap:8px}
.rov{flex-grow:1;font-size:15px;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums}
.fh{font-size:12px;line-height:1.45;margin-top:7px;display:flex;align-items:flex-start;gap:6px}
.fh.g{color:var(--ok)} .fh.n{color:#8E8E8E} .fh.r{color:var(--red)}
.rule{height:1px;background:var(--line)}
.locT{font-size:15px;font-weight:600} .locS{font-size:13px;color:var(--mut);margin-top:3px}
.locA{font-size:13px;color:#A2A2A2;margin-top:8px;line-height:1.45}
.chkrow{display:flex;align-items:center;gap:13px;padding:4px 0 2px}
.chk{width:24px;height:24px;border-radius:7px;background:var(--red);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mfoot{padding:16px 30px 26px}
.cta{width:100%;height:60px;border:none;border-radius:999px;background:var(--cta);color:#fff;font-size:17px;font-weight:700}
.cta:disabled{background:#E4C0C6;cursor:not-allowed}

/* sheet */
.sheet{position:absolute;inset:74px 0 0;background:#fff;border-top:1px solid var(--line);display:flex;flex-direction:column;z-index:9}
.sheet.p{inset:66px 0 0}
.shdr{display:flex;align-items:center;gap:12px;padding:18px 26px 12px}
.stitle{font-size:16px;font-weight:700;flex-grow:1}
.swrap{padding:0 26px 12px;position:relative}
.sinput{width:100%;height:46px;border:1px solid #D9D9D9;border-radius:10px;padding:0 14px 0 40px;font-size:14px;outline:none}
.sinput:focus{border-color:var(--red)}
.sic{position:absolute;left:40px;top:14px}
.slist{flex-grow:1;overflow-y:auto;padding:0 14px 18px}
.opt{width:100%;display:flex;align-items:center;gap:12px;padding:13px 12px;border:none;background:transparent;border-radius:10px;text-align:left}
.opt:hover{background:#F6F6F6}
.optm{font-size:14px;font-weight:600;color:#2B2B2B}
.opts{font-size:12px;color:#8E8E8E;margin-top:2px;line-height:1.45}
.optc{font-size:13px;font-weight:700;color:var(--mut);letter-spacing:.4px;font-variant-numeric:tabular-nums}
.sempty{padding:26px 12px;font-size:13px;color:var(--faint);text-align:center}

/* ---------- mobile screens ---------- */
.phdr{display:flex;align-items:center;gap:14px;padding:18px;border-bottom:1px solid var(--line);flex-shrink:0}
.pht{font-size:20px;font-weight:600;flex-grow:1}
.ptabs{display:flex;flex-shrink:0}
.ptab{flex-grow:1;text-align:center;padding:13px 0 11px;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--mut);background:none;border-left:none;border-right:none;border-top:none;position:relative}
.ptab[aria-selected="true"]{border-bottom:2.5px solid var(--red);color:var(--red);font-weight:700}
.dot{position:absolute;top:9px;margin-left:3px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.card{border:1px solid var(--brd);border-radius:14px;padding:15px 16px}
.card.bad{border:1.5px solid var(--alert-brd)}
.card.ok{border:1px solid var(--ok-brd);background:var(--ok-bg)}
.alert{border:1px solid var(--alert-brd);background:var(--alert-bg);border-radius:14px;padding:14px 15px;display:flex;gap:11px;align-items:flex-start}
.aT{font-size:14.5px;font-weight:700;color:var(--alert-tx);line-height:1.35}
.aB{font-size:13px;color:#6F2733;line-height:1.55;margin-top:5px}
.pillbtn{height:42px;padding:0 20px;border:none;border-radius:999px;background:var(--cta);color:#fff;font-size:14px;font-weight:700}
.pillbtn.full{width:100%}
.pillbtn.outline{background:#fff;color:var(--txt);border:1px solid var(--brd)}
.badge{position:absolute;top:-6px;right:-8px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.chip{background:#EAF1FB;color:#2C6BC4;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:6px;white-space:nowrap}
.issue{display:flex;align-items:flex-start;gap:8px;margin-top:11px;background:var(--alert-bg);border-radius:9px;padding:10px 11px}
.issueT{font-size:12.5px;color:var(--alert-tx);line-height:1.5;font-weight:600}
.okrow{display:flex;align-items:center;gap:8px;margin-top:11px}
.okT{font-size:12.5px;color:var(--ok);font-weight:600}
.acts{display:flex;align-items:center;gap:10px;margin-top:13px}
.acts a{font-size:14px;font-weight:600}
.sep{color:#DDD}
.bar{flex-grow:1;height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.barf{height:100%;background:var(--ok);transition:width .35s ease}
.grey{height:8px;background:#F1F1F1}
.pfoot{border-top:1px solid #EBEBEB;padding:14px 18px 20px;background:#fff;flex-shrink:0}
.toast{position:absolute;left:16px;right:16px;bottom:18px;background:#1E874B;color:#fff;border-radius:12px;padding:13px 16px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:20;animation:rise .3s ease}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.navwrap{display:flex;gap:8px;justify-content:center;margin-bottom:22px;flex-wrap:wrap}
@media(max-width:900px){.phone{width:100%;max-width:390px}}
</style>
</head>

/* ---------- data helpers ---------- */
const provs = () => Object.keys(AREA);
const kotas = p => (p && AREA[p]) ? Object.keys(AREA[p]) : [];
const kecs  = (p,k) => (p&&k&&AREA[p]&&AREA[p][k]) ? Object.keys(AREA[p][k]) : [];
const kels  = (p,k,c) => (p&&k&&c&&AREA[p]&&AREA[p][k]&&AREA[p][k][c]) ? AREA[p][k][c] : [];
function codesFor(p,k,c){
  const m={},out=[];
  kels(p,k,c).forEach(r=>{ if(!m[r[1]]){m[r[1]]=[];out.push(r[1]);} m[r[1]].push(r[0]); });
  return out.sort().map(code=>({code,kel:m[code]}));
}
function lookupCode(code){
  const hits=[];
  for(const p of provs()) for(const k of kotas(p)) for(const c of kecs(p,k))
    for(const r of kels(p,k,c)) if(r[1]===code) hits.push({prov:p,kota:k,kec:c,kel:r[0],code:r[1]});
  return hits;
}
const esc = s => String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const nz = s => String(s||'').toLowerCase();

function formSheet(){
  const f=S.f, q=nz(f.q); let title='',ph='',opts=[];
  if(f.open==='prov'){ title='Pilih Provinsi'; ph='Cari provinsi';
    opts=provs().filter(v=>nz(v).includes(q)).map(v=>({label:v,sub:'',code:'',act:`prov|${v}`})); }
  else if(f.open==='kota'){ title='Pilih Kota/Kabupaten'; ph='Cari kota atau kabupaten';
    opts=kotas(f.prov).filter(v=>nz(v).includes(q)).map(v=>({label:v,sub:'',code:'',act:`kota|${v}`})); }
  else if(f.open==='kec'){ title='Pilih Daerah (Kecamatan)'; ph='Cari kecamatan';
    opts=kecs(f.prov,f.kota).filter(v=>nz(v).includes(q)).map(v=>({label:v,sub:'Kec. di '+f.kota,code:'',act:`kec|${v}`})); }
  else if(f.open==='kel'){ title='Pilih Kelurahan'; ph='Cari kelurahan atau kode pos';
    let rows=kels(f.prov,f.kota,f.kec);
    if(f.revFilter) rows=rows.filter(r=>r[1]===f.revFilter);
    opts=rows.filter(r=>nz(r[0]).includes(q)||r[1].includes(q)).map(r=>({
      label:r[0], code:r[1],
      sub: COLLIDE.includes(r[0]) ? 'Kelurahan di Kec. '+f.kec+' (nama ini juga dipakai sebagai kecamatan)' : '',
      act:`kel|${r[0]}`})); }
  else if(f.open==='kode'){ title='Pilih Kode Pos'; ph='Cari kode pos atau nama kelurahan';
    opts=codesFor(f.prov,f.kota,f.kec).filter(c=>!q||c.code.includes(q)||c.kel.some(k=>nz(k).includes(q)))
      .map(c=>({label:c.code,sub:'Meliputi '+c.kel.join(', '),code:'',act:`kode|${c.code}`})); }
  else if(f.open==='rev'){ title='Cari dengan kode pos'; ph='Ketik 5 digit kode pos, misal 11460';
    if(/^\d{3,5}$/.test(f.q)) opts=lookupCode(f.q).map(h=>({
      label:h.kel, sub:'Kec. '+h.kec+', '+h.kota, code:h.code, act:`rev|${h.prov}~${h.kota}~${h.kec}~${h.kel}`})); }

  return `<div class="sheet">
    <div class="shdr"><div class="stitle">${title}</div><button class="iconbtn" data-close="1">${I.x}</button></div>
    <div class="swrap"><div class="sic">${I.search}</div>
      <input class="sinput" id="fq" value="${esc(f.q)}" placeholder="${esc(ph)}" autocomplete="off"></div>
    <div class="slist">
      ${opts.map(o=>`<button class="opt" data-pick="${esc(o.act)}">
        <div style="flex-grow:1"><div class="optm">${esc(o.label)}</div>${o.sub?`<div class="opts">${esc(o.sub)}</div>`:''}</div>
        ${o.code?`<div class="optc">${o.code}</div>`:''}</button>`).join('')}
      ${opts.length?'':'<div class="sempty">Tidak ada hasil</div>'}
    </div></div>`;
}

            <button class="pillbtn" style="flex-grow:1" data-fix="${a.id}">Lengkapi Alamat</button>
            <button class="pillbtn outline" data-nav="book">Pilih Lain</button></div></div></div>`;
  const radio=(on,label)=>`<div style="border:${on?'1.5px solid var(--red)':'1px solid var(--brd)'};background:${on?'var(--alert-bg)':'#fff'};border-radius:10px;height:50px;display:flex;align-items:center;justify-content:center;gap:9px">
      <span style="width:18px;height:18px;border-radius:50%;border:2px solid ${on?'var(--red)':'#C8C8C8'};display:inline-flex;align-items:center;justify-content:center">${on?'<span style="width:9px;height:9px;border-radius:50%;background:var(--red)"></span>':''}</span>
      <span style="font-size:14px;${on?'font-weight:600':'color:var(--mut)'}">${label}</span></div>`;
  return `${phdr('Checkout')}
    <div class="pbody">
      <div style="padding:18px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:15px">
          <div style="font-size:17px;font-weight:700;flex-grow:1">Pilih Alamat Pengiriman</div>${I.chevU}</div>
        <div class="g2" style="gap:12px;margin-bottom:14px">${radio(true,'Pengiriman ke Rumah')}${radio(false,'Ambil di Toko')}</div>
        ${addrCard}
      </div>
      <div class="grey"></div>
      <div style="padding:18px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
          <div style="font-size:17px;font-weight:700;flex-grow:1">Ringkasan Pesanan (1 Item)</div>${I.chevU}</div>
        <div style="font-size:13.5px;font-weight:700;letter-spacing:.4px;margin-bottom:12px">MARKS &amp; SPENCER</div>
        <div style="display:flex;gap:13px">
          <div style="width:74px;height:88px;background:#EDEDED;border-radius:8px;flex-shrink:0"></div>
          <div style="flex-grow:1">
            <div style="font-size:12px;color:var(--mut)">MARKS &amp; SPENCER</div>
            <div style="font-size:14.5px;margin-top:3px">Lace Bib Collared Shirt</div>
            <div style="font-size:12.5px;color:var(--faint);margin-top:4px">UK 10/REG | Hitam</div>
            <div style="display:flex;align-items:baseline;gap:9px;margin-top:7px">
              <span style="font-size:12px;color:var(--mut)">1x</span>
              <span style="font-size:15.5px;font-weight:700">Rp529.000</span></div></div></div>
        <div style="border:1px solid ${okay?'var(--brd)':'#EFEFEF'};background:${okay?'#fff':'#FAFAFA'};border-radius:10px;height:50px;display:flex;align-items:center;gap:11px;padding:0 15px;margin-top:16px">
          ${I.truck}<span style="font-size:14px;flex-grow:1;color:${okay?'var(--txt)':'var(--faint)'}">${okay?'RPX Regular - Rp18.000':'Metode Pengiriman'}</span>
          <span style="transform:rotate(180deg)">${I.chevU}</span></div>
        ${okay?'':'<div style="font-size:12px;color:var(--faint);margin-top:8px;padding-left:2px">Tersedia setelah alamat lengkap</div>'}
      </div>
    </div>
    <div class="pfoot">
      <div style="display:flex;align-items:center;gap:14px">
        <div style="flex-grow:1"><div style="font-size:13px;color:var(--mut)">Total Pembayaran</div>
          <div style="font-size:19px;font-weight:700;margin-top:2px">Rp${okay?'547.000':'529.000'}</div></div>
        <button class="cta" style="width:auto;height:52px;padding:0 34px;font-size:16px" ${okay?'':'disabled'}>Lanjut Bayar</button></div>
      ${okay?'':'<div style="font-size:12px;color:var(--faint);text-align:right;margin-top:8px">Lengkapi alamat untuk melanjutkan</div>'}
    </div>`;
}

/* picker sheet inside the phone */
function pickerSheet(){
  const p=S.picker; if(!p) return '';
  const a=S.addrs.find(x=>x.id===p.id); const q=nz(p.q);
  const stage = a.kec ? 'kel' : 'kec';
  let title,ph,opts;
  if(stage==='kec'){
    title='Pilih Kecamatan'; ph='Cari kecamatan';
    opts=kecs(a.prov,a.kota).filter(v=>nz(v).includes(q)).map(v=>({label:v,sub:'Kec. di '+a.kota,code:'',act:'pkec|'+v}));
  } else {
    title='Pilih Kelurahan'; ph='Cari kelurahan atau kode pos';
    opts=kels(a.prov,a.kota,a.kec).filter(r=>nz(r[0]).includes(q)||r[1].includes(q)).map(r=>({
      label:r[0], code:r[1],
      sub: COLLIDE.includes(r[0]) ? 'Kelurahan di Kec. '+a.kec+' (nama ini juga dipakai sebagai kecamatan)' : '',
      act:'pkel|'+r[0]}));
  }
  return `<div class="sheet p">
    <div class="shdr"><div class="stitle">${title}</div><button class="iconbtn" data-pclose="1">${I.x}</button></div>
    <div style="padding:0 26px 10px;font-size:12.5px;color:var(--mut);line-height:1.5">${esc(a.name)} &middot; ${esc(a.street)}</div>
    <div class="swrap"><div class="sic">${I.search}</div>
      <input class="sinput" id="pq" value="${esc(p.q)}" placeholder="${esc(ph)}" autocomplete="off"></div>
    <div class="slist">
      ${opts.map(o=>`<button class="opt" data-pick="${esc(o.act)}">
        <div style="flex-grow:1"><div class="optm">${esc(o.label)}</div>${o.sub?`<div class="opts">${esc(o.sub)}</div>`:''}</div>
        ${o.code?`<div class="optc">${o.code}</div>`:''}</button>`).join('')}
      ${opts.length?'':'<div class="sempty">Tidak ada hasil</div>'}
    </div></div>`;
}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', t.dataset.view===S.view));
  const root=document.getElementById('root');
  if(S.view==='form'){
    root.innerHTML = `
      <div class="hint">Form alamat di web. Bandingkan kondisi sekarang dengan dua opsi perbaikan.
        Dropdown memakai data master RPX (DKI Jakarta: 6 kota/kab, 44 kecamatan, 268 kelurahan).</div>
      <div class="segrow">
        <button class="seg" data-var="now" aria-pressed="${S.variant==='now'}">Sekarang</button>
        <button class="seg" data-var="a" aria-pressed="${S.variant==='a'}">Opsi A - Kelurahan</button>
        <button class="seg" data-var="b" aria-pressed="${S.variant==='b'}">Opsi B - Dropdown kode pos</button>
      </div>
      ${formModal()}
      <div class="caption">${S.variant==='a'?'Coba: klik Kelurahan, atau "Cari dengan kode pos" lalu ketik 11460':S.variant==='b'?'Coba: pilih Daerah lalu Kode Pos':'Kode pos diketik bebas, tidak ada yang memvalidasi'}</div>`;
  } else {
    const screens={notif:scrNotif,fix:scrFix,book:scrBook,checkout:scrCheckout};
    root.innerHTML = `
      <div class="hint">Alur di aplikasi. Perbaiki alamat lewat notifikasi, lalu buka <b>Checkout</b> dan lihat blokirnya hilang.
        Empat layar ini adalah empat lapis yang sama: dorong, perbaiki, simpan, cegah.</div>
      <div class="navwrap">
        ${[['notif','1. Notifikasi'],['fix','2. Perbaiki Alamat'],['book','3. Buku Alamat'],['checkout','4. Checkout']]
          .map(([k,l])=>`<button class="seg" data-scr="${k}" aria-pressed="${S.screen===k}">${l}</button>`).join('')}
      </div>
      <div class="phonewrap"><div class="phone">${screens[S.screen]()}${pickerSheet()}
        ${S.toast?`<div class="toast">${esc(S.toast)}</div>`:''}</div></div>
      <div class="caption">${bad().length? bad().length+' alamat masih perlu diperbarui':'Semua alamat sudah lengkap'}</div>`;
  }
  const fq=document.getElementById('fq'); if(fq){ fq.focus(); fq.setSelectionRange(fq.value.length,fq.value.length); }
  const pq=document.getElementById('pq'); if(pq){ pq.focus(); pq.setSelectionRange(pq.value.length,pq.value.length); }
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-view],[data-var],[data-scr],[data-open],[data-close],[data-pick],[data-nav],[data-fix],[data-pclose],#reset');
  if(!t) return;
  if(t.id==='reset'){ S=FRESH(); render(); return; }
  if(t.dataset.view){ S.view=t.dataset.view; render(); return; }
  if(t.dataset.var){ S.variant=t.dataset.var; S.f.open=null; S.f.q=''; render(); return; }
  if(t.dataset.scr){ S.screen=t.dataset.scr; S.picker=null; S.toast=null; render(); return; }
  if(t.dataset.open){ S.f.open=t.dataset.open; S.f.q=''; render(); return; }
  if(t.dataset.close){ S.f.open=null; S.f.q=''; render(); return; }
  if(t.dataset.pclose){ S.picker=null; render(); return; }
  if(t.dataset.nav){
    const n=t.dataset.nav;
    if(n==='back') S.screen='notif'; else S.screen=n;
    S.toast=null; render(); return;
  }
  if(t.dataset.fix){ S.picker={id:+t.dataset.fix,q:''}; S.toast=null; render(); return; }
  if(t.dataset.pick){
    const [kind,val]=t.dataset.pick.split('|');
    const f=S.f;
    if(kind==='prov'){ Object.assign(f,{prov:val,kota:'',kec:'',kel:'',kode:'',open:null,q:'',revFilter:null}); }
    else if(kind==='kota'){ Object.assign(f,{kota:val,kec:'',kel:'',kode:'',open:null,q:'',revFilter:null}); }
    else if(kind==='kec'){ Object.assign(f,{kec:val,kel:'',kode:'',open:null,q:'',revFilter:null}); }
    else if(kind==='kel'){ Object.assign(f,{kel:val,open:null,q:'',revFilter:null}); }
    else if(kind==='kode'){ Object.assign(f,{kode:val,open:null,q:''}); }
    else if(kind==='rev'){ const [p,k,c,l]=val.split('~'); Object.assign(f,{prov:p,kota:k,kec:c,kel:l,open:null,q:'',revFilter:null}); }
    else if(kind==='pkec'){ const a=S.addrs.find(x=>x.id===S.picker.id); a.kec=val; S.picker.q=''; }
    else if(kind==='pkel'){
      const a=S.addrs.find(x=>x.id===S.picker.id);
      a.kel=val; kels(a.prov,a.kota,a.kec).forEach(r=>{ if(r[0]===val) a.kode=r[1]; });
      S.picker=null; S.toast='Alamat diperbarui. Kode pos '+a.kode+' terisi otomatis.';
      setTimeout(()=>{ S.toast=null; render(); },2600);
    }
    render(); return;
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='fq'){ S.f.q=e.target.value; render(); }
  if(e.target.id==='pq'){ S.picker.q=e.target.value; render(); }
});
render();
</script>
</body>
</html>
